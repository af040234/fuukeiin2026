html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background-color:var(--bg);color:var(--tx);font-family:Meiryo,"メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;padding:12px;max-width:560px}
h1{font-size:22px;margin:4px 0 8px;padding:16px;border-radius:22px;color:#fff;text-align:center;background:var(--ac);text-shadow:0 2px 0 rgba(0,0,0,.15);box-shadow:0 4px 0 var(--acd)}
.note{font-size:12px;color:var(--sub)}
.prog{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:12px;margin:10px 0}
.prog span#cnt{font-weight:700;font-size:16px}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s;border-radius:7px}
select,input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin:6px 0;font-family:inherit}
select:focus,input:focus{outline:none;border-color:var(--ac)}
.item{--c:var(--ac);background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 var(--line)}
.item.done{background:var(--okbg);border-color:var(--ok);border-left-color:var(--ok)}
.name{font-weight:700;font-size:16px}
.sub{font-size:12px;color:var(--sub);margin-top:2px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{font-family:inherit;font-size:15px;padding:10px 18px;border-radius:999px;border:2px solid var(--ac);background:transparent;color:var(--ac);font-weight:700}
.done button{background:var(--ok);border-color:var(--ok);color:var(--btxt,#fff)}
.hl{outline:3px solid var(--ac)}
details summary{cursor:pointer}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs button{flex:1 1 auto;white-space:nowrap;padding:12px 6px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--sub);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.item.paused{opacity:.75}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lk a{font-size:13px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);color:var(--tx);text-decoration:none;background:var(--card)}
</style>
